# Local development dependency (optional: SQL Server can also be installed on Windows).
# Web and Api run with `dotnet run`.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: senecare-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      TZ: Africa/Dakar
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - senecare-sqldata:/var/opt/mssql

volumes:
  senecare-sqldata:
