# Local development dependencies. Web and Api run with `dotnet run` for now;
# their Dockerfiles arrive in Phase 13.
services:
  postgres:
    image: postgres:17-alpine
    container_name: senecare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-senecare}
      POSTGRES_USER: ${POSTGRES_USER:-senecare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Africa/Dakar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - senecare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  senecare-pgdata:
