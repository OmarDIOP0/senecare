# Render Blueprint: the SENECARE test site (« Staging ») and its PostgreSQL database.
# Render dashboard → New → Blueprint → this repository. Free plans: the site sleeps after 15 min without
# visits, uploaded photos are lost at each restart, the free database expires after 30 days.
databases:
  - name: senecare-db
    plan: free
    region: frankfurt          # closest Render region to Dakar
    databaseName: senecare
    user: senecare

services:
  - type: web
    name: senecare
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true            # each push on the branch redeploys
    envVars:
      # Test site: banner « Version de test », code shown under the boxes (refused in Production).
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ConnectionStrings__Default
        fromDatabase:
          name: senecare-db
          property: connectionString
      # Secrets generated by Render (random base64, 256 bits), never in the repository.
      - key: Security__HashKey
        generateValue: true
      - key: Jwt__SigningKey
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Database__SeedOnStartup
        value: "true"
      - key: Otp__ShowCodeOnPage
        value: "true"
      # Your number (77 123 45 67): Super-admin at startup. Asked by Render when the Blueprint is created.
      - key: Bootstrap__SuperAdminPhones
        sync: false
