# Render Blueprint: the SENECARE test site (« Staging »). Render dashboard → New → Blueprint → this repository.
# The database is not created here (a Render workspace has only one free PostgreSQL): paste the URL of an
# existing one when asked (Render « Internal Database URL », or Neon / Supabase « postgresql://… »).
# Free plan: the site sleeps after 15 min without visits, uploaded photos are lost at each restart.
services:
  - type: web
    name: senecare
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true            # each push on the branch redeploys
    envVars:
      # Test site: banner « Version de test », code shown under the boxes (refused in Production).
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      # postgresql://user:password@host:5432/database (?sslmode=require accepted). Asked at creation.
      - key: ConnectionStrings__Default
        sync: false
      # Secrets generated by Render (random base64, 256 bits), never in the repository.
      - key: Security__HashKey
        generateValue: true
      - key: Jwt__SigningKey
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Database__SeedOnStartup
        value: "true"
      - key: Otp__ShowCodeOnPage
        value: "true"
      # Your number (77 123 45 67): Super-admin at startup. Asked by Render when the Blueprint is created.
      - key: Bootstrap__SuperAdminPhones
        sync: false
